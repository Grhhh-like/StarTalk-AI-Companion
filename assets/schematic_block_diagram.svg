<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f8ff"/>
      <stop offset="100%" stop-color="#eef3fc"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="800" y="48" font-size="30" font-weight="bold" text-anchor="middle" fill="#1a3a6b" font-family="Microsoft YaHei, sans-serif">星语 StarTalk · 桌面级 AI 语音交互伴侣 — 原理框图</text>
  <text x="800" y="78" font-size="16" text-anchor="middle" fill="#666" font-family="Microsoft YaHei, sans-serif">ESP32-S3 + INMP441 + MAX98357A + GC9A01 + SHT40 | 嘉立创EDA 全开源</text>

  <!-- ============ 主控 ============ -->
  <rect x="560" y="300" width="320" height="340" rx="18" fill="#1f4e8c" filter="url(#shadow)"/>
  <text x="720" y="345" font-size="26" font-weight="bold" text-anchor="middle" fill="#fff" font-family="Microsoft YaHei, sans-serif">ESP32-S3-WROOM-1</text>
  <text x="720" y="378" font-size="15" text-anchor="middle" fill="#cfe0ff" font-family="Microsoft YaHei, sans-serif">N8R8 · 双核240MHz · WiFi/BLE</text>
  <text x="720" y="405" font-size="15" text-anchor="middle" fill="#cfe0ff" font-family="Microsoft YaHei, sans-serif">ESP-SR 离线唤醒 · LLM 客户端</text>
  <text x="720" y="432" font-size="15" text-anchor="middle" fill="#cfe0ff" font-family="Microsoft YaHei, sans-serif">I2S0 录音 / I2S1 播放</text>
  <text x="720" y="459" font-size="15" text-anchor="middle" fill="#cfe0ff" font-family="Microsoft YaHei, sans-serif">SPI LCD / I2C 传感</text>

  <!-- 主控引脚标签 -->
  <text x="545" y="380" font-size="13" text-anchor="end" fill="#1f4e8c" font-family="monospace">I2S0 SCK/WS/SD (4/5/6)</text>
  <text x="545" y="440" font-size="13" text-anchor="end" fill="#1f4e8c" font-family="monospace">I2S1 BCLK/WS/DIN (15/16/17)</text>
  <text x="545" y="500" font-size="13" text-anchor="end" fill="#1f4e8c" font-family="monospace">SPI (12/11/10/9/8/7)</text>
  <text x="545" y="560" font-size="13" text-anchor="end" fill="#1f4e8c" font-family="monospace">I2C SDA/SCL (2/3)</text>
  <text x="895" y="430" font-size="13" fill="#1f4e8c" font-family="monospace">GPIO18 LED</text>

  <!-- ============ 麦克风 ============ -->
  <rect x="120" y="320" width="260" height="150" rx="14" fill="#0e7a5f" filter="url(#shadow)"/>
  <text x="250" y="360" font-size="21" font-weight="bold" text-anchor="middle" fill="#fff" font-family="Microsoft YaHei, sans-serif">INMP441</text>
  <text x="250" y="390" font-size="14" text-anchor="middle" fill="#d9fff2" font-family="Microsoft YaHei, sans-serif">MEMS 数字麦克风</text>
  <text x="250" y="412" font-size="13" text-anchor="middle" fill="#d9fff2" font-family="Microsoft YaHei, sans-serif">I2S · 24bit · 61dB SNR</text>
  <text x="250" y="434" font-size="13" text-anchor="middle" fill="#d9fff2" font-family="Microsoft YaHei, sans-serif">唤醒词「你好小星」输入</text>

  <!-- 麦克风->主控连线 -->
  <path d="M 380 395 L 545 395" stroke="#333" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="460" y="385" font-size="13" fill="#0e7a5f" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">I2S0 录音</text>

  <!-- ============ 功放+喇叭 ============ -->
  <rect x="120" y="640" width="260" height="150" rx="14" fill="#b3561a" filter="url(#shadow)"/>
  <text x="250" y="680" font-size="21" font-weight="bold" text-anchor="middle" fill="#fff" font-family="Microsoft YaHei, sans-serif">MAX98357A</text>
  <text x="250" y="710" font-size="14" text-anchor="middle" fill="#ffe6d1" font-family="Microsoft YaHei, sans-serif">D类功放 3.2W</text>
  <text x="250" y="732" font-size="13" text-anchor="middle" fill="#ffe6d1" font-family="Microsoft YaHei, sans-serif">I2S 数字输入</text>
  <text x="250" y="754" font-size="13" text-anchor="middle" fill="#ffe6d1" font-family="Microsoft YaHei, sans-serif">8Ω / 3W 喇叭</text>

  <!-- 功放<-主控连线 -->
  <path d="M 545 660 L 380 660" stroke="#333" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="460" y="650" font-size="13" fill="#b3561a" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">I2S1 播放</text>

  <!-- ============ LCD ============ -->
  <rect x="1020" y="300" width="300" height="170" rx="14" fill="#6a3ab2" filter="url(#shadow)"/>
  <text x="1170" y="345" font-size="21" font-weight="bold" text-anchor="middle" fill="#fff" font-family="Microsoft YaHei, sans-serif">GC9A01 1.28" 圆屏</text>
  <text x="1170" y="375" font-size="14" text-anchor="middle" fill="#e9dcff" font-family="Microsoft YaHei, sans-serif">240×240 SPI</text>
  <text x="1170" y="397" font-size="13" text-anchor="middle" fill="#e9dcff" font-family="Microsoft YaHei, sans-serif">表情 / 状态 / 环境显示</text>
  <text x="1170" y="419" font-size="13" text-anchor="middle" fill="#e9dcff" font-family="Microsoft YaHei, sans-serif">听/想/说 动画</text>

  <!-- LCD<-主控连线 -->
  <path d="M 880 380 L 1015 380" stroke="#333" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="950" y="370" font-size="13" fill="#6a3ab2" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">SPI</text>

  <!-- ============ 传感器 ============ -->
  <rect x="1020" y="560" width="300" height="170" rx="14" fill="#a31e3c" filter="url(#shadow)"/>
  <text x="1170" y="605" font-size="21" font-weight="bold" text-anchor="middle" fill="#fff" font-family="Microsoft YaHei, sans-serif">SHT40 温湿度</text>
  <text x="1170" y="635" font-size="14" text-anchor="middle" fill="#ffd9e2" font-family="Microsoft YaHei, sans-serif">I2C · ±0.2°C</text>
  <text x="1170" y="657" font-size="13" text-anchor="middle" fill="#ffd9e2" font-family="Microsoft YaHei, sans-serif">±1.8%RH</text>
  <text x="1170" y="679" font-size="13" text-anchor="middle" fill="#ffd9e2" font-family="Microsoft YaHei, sans-serif">语音查询「现在温度」</text>

  <!-- 传感器<-主控连线 -->
  <path d="M 880 620 L 1015 620" stroke="#333" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="950" y="610" font-size="13" fill="#a31e3c" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">I2C</text>

  <!-- ============ 电源 ============ -->
  <rect x="320" y="120" width="760" height="130" rx="14" fill="#f4f7ff" stroke="#1f4e8c" stroke-width="2" filter="url(#shadow)"/>
  <text x="700" y="155" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a3a6b" font-family="Microsoft YaHei, sans-serif">电源系统</text>

  <rect x="350" y="170" width="160" height="52" rx="10" fill="#ffd76a"/>
  <text x="430" y="193" font-size="15" font-weight="bold" text-anchor="middle" fill="#5a4300" font-family="Microsoft YaHei, sans-serif">Type-C 5V</text>
  <text x="430" y="211" font-size="12" text-anchor="middle" fill="#5a4300" font-family="Microsoft YaHei, sans-serif">USB 充电/烧录</text>

  <text x="528" y="200" font-size="22" fill="#1f4e8c">→</text>

  <rect x="550" y="170" width="160" height="52" rx="10" fill="#b8e0b8"/>
  <text x="630" y="193" font-size="15" font-weight="bold" text-anchor="middle" fill="#1c4a1c" font-family="Microsoft YaHei, sans-serif">TP4057</text>
  <text x="630" y="211" font-size="12" text-anchor="middle" fill="#1c4a1c" font-family="Microsoft YaHei, sans-serif">500mA 锂电充电</text>

  <text x="728" y="200" font-size="22" fill="#1f4e8c">→</text>

  <rect x="750" y="170" width="160" height="52" rx="10" fill="#c9d9f0"/>
  <text x="830" y="193" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a3a6b" font-family="Microsoft YaHei, sans-serif">3.7V 锂电池</text>
  <text x="830" y="211" font-size="12" text-anchor="middle" fill="#1a3a6b" font-family="Microsoft YaHei, sans-serif">800–1200mAh</text>

  <text x="928" y="200" font-size="22" fill="#1f4e8c">→</text>

  <rect x="950" y="170" width="110" height="52" rx="10" fill="#e8c9f0"/>
  <text x="1005" y="193" font-size="15" font-weight="bold" text-anchor="middle" fill="#4a1c5a" font-family="Microsoft YaHei, sans-serif">ME6211</text>
  <text x="1005" y="211" font-size="12" text-anchor="middle" fill="#4a1c5a" font-family="Microsoft YaHei, sans-serif">3.3V LDO</text>

  <!-- 电源->主控 -->
  <path d="M 830 222 L 830 300" stroke="#1f4e8c" stroke-width="2.5" stroke-dasharray="6,4" fill="none" marker-end="url(#arrow)"/>
  <text x="845" y="265" font-size="13" fill="#1f4e8c" font-family="Microsoft YaHei, sans-serif">3.3V 供电</text>

  <!-- ============ 云端 ============ -->
  <rect x="560" y="50" width="320" height="46" rx="12" fill="#eef3fc" stroke="#1f4e8c" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="720" y="80" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a3a6b" font-family="Microsoft YaHei, sans-serif">云端: LLM 对话 · TTS 合成 (WiFi)</text>
  <path d="M 720 96 L 720 300" stroke="#1f4e8c" stroke-width="2" stroke-dasharray="6,4" fill="none" marker-end="url(#arrow)"/>

  <!-- 底部说明 -->
  <rect x="120" y="860" width="1240" height="70" rx="12" fill="#fff" stroke="#ccc"/>
  <text x="140" y="890" font-size="15" fill="#333" font-family="Microsoft YaHei, sans-serif">核心卖点: 离线唤醒不上云 → 大模型对话 → 本地TTS开口说话 → 表情屏反馈 → 环境感知</text>
  <text x="140" y="916" font-size="13" fill="#888" font-family="Microsoft YaHei, sans-serif">成本约 100–150 元 | PCB 嘉立创免费打样可复刻 | 完整工程见 hardware/ 目录</text>
</svg>
